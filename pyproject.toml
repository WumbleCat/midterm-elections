[project]
name = "electiondata"
version = "0.1.0"
description = "Point-in-time-correct U.S. election data platform: ingestion, DuckDB/Parquet store, feature construction and a stable Python API."
readme = "README.md"
authors = [
    { name = "WumbleCat", email = "komethtauch04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]

[project.scripts]
electiondata = "electiondata.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "electiondata"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit live external endpoints (deselected by default; run with --run-integration)",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
